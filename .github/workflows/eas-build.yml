name: MINDSPARK EAS Builds
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        type: choice
        options:
          - all
          - android
          - ios
        default: android
jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install EAS CLI
        run: npm install --global eas-cli
      - name: Verify Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing or empty. Add a valid Expo access token in GitHub Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "Expo token is present."
      - name: Link existing Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account rjdilip79s-team --force --non-interactive
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android
      - name: Build Android
        if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
      - name: Build iOS
        if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile preview --non-interactive
